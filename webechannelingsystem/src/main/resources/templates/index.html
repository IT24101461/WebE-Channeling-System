<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to E-Channeling Center</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional: custom CSS for hospital theme -->
    <style>
        body {
            background: #e6f2ff; /* light hospital blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .welcome-card {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            max-width: 750px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .welcome-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            color: #555;
        }

        .btn-portal {
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            padding: 12px 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-portal:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn-admin {
            background-color: #1a73e8;
            color: #fff;
        }
        .btn-admin:hover { background-color: #155ab6; }

        .btn-doctor {
            background-color: #34a853;
            color: #fff;
        }
        .btn-doctor:hover { background-color: #2a8440; }

        .btn-patient {
            background-color: #fbbc05;
            color: #000;
        }
        .btn-patient:hover { background-color: #e0a800; }

        .btn-emergency {
            background-color: #dc3545;
            color: #fff;
            border: 2px solid #b02a37;
        }
        .btn-emergency:hover {
            background-color: #b02a37;
            color: #fff;
        }

        .btn-portal i {
            font-size: 1.2rem;
        }

        @media (max-width: 576px) {
            .welcome-card { padding: 40px 20px; }
            .btn-portal { width: 100%; justify-content: center; }
        }
    </style>
    <!-- Optional: Bootstrap icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<div class="container d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="welcome-card text-center">
        <h1 class="mb-3 text-primary">Welcome to E-Channeling Center</h1>
        <p class="mb-4 text-muted fs-5">Book appointments easily online with your favorite doctors.
            Manage schedules efficiently and stay healthy!</p>
        <div class="d-flex flex-wrap justify-content-center gap-3">
            <a th:href="@{/admin/login}" class="btn btn-admin btn-portal">
                <i class="bi bi-shield-lock"></i> Admin Portal
            </a>
            <a th:href="@{/doctor/login}" class="btn btn-doctor btn-portal">
                <i class="bi bi-person-badge"></i> Doctor Portal
            </a>
            <a th:href="@{/patient/login}" class="btn btn-patient btn-portal">
                <i class="bi bi-person-circle"></i> Patient Portal
            </a>
            <a th:href="@{/emergency/register}" class="btn btn-emergency btn-portal">
                <i class="bi bi-exclamation-triangle-fill"></i> Emergency Patient
            </a>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
