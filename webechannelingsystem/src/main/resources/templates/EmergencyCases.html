<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hospital Emergency Cases</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e6f2ff; /* light blue */
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .login-card {
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h2 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #155ab6;
        }
        .hidden {
            display: none;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin: auto;
        }
        th, td {
            border: 2px solid #444;
            padding: 8px;
            text-align: center;
            font-weight: bold;
        }
        th {
            background-color: #1a73e8;
            color: white;
        }

         body {
            background: #e6f2ff; /* light hospital blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .welcome-card {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            max-width: 750px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .welcome-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            color: #555;
        }

        .btn-portal {
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            padding: 12px 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-portal:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn-admin {
            background-color: #1a73e8;
            color: #fff;
        }
        .btn-admin:hover { background-color: #155ab6; }

        .btn-doctor {
            background-color: #34a853;
            color: #fff;
        }
        .btn-doctor:hover { background-color: #2a8440; }

        .btn-patient {
            background-color: #fbbc05;
            color: #000;
        }
        .btn-patient:hover { background-color: #e0a800; }

        .btn-emergency {
            background-color: #dc3545;
            color: #fff;
            border: 2px solid #b02a37;
        }
        .btn-emergency:hover {
            background-color: #b02a37;
            color: #fff;
        }

        .btn-portal i {
            font-size: 1.2rem;
        }

        @media (max-width: 576px) {
            .welcome-card { padding: 40px 20px; }
            .btn-portal { width: 100%; justify-content: center; }
        }
    </style>

    <!-- Optional: Bootstrap icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>
<body>
<h2 style="text-align:center;">All Reported Hospital Emergency Cases</h2>
<table>
    <thead>
    <tr>
        <th>Patient's Full Name</th>
        <th>Patient's Email</th>
        <th>Patient's Contact Number</th>
        <th>Patient's Age</th>
        <th>Patient's Gender</th>
        <th>Patient's Issues</th>
        <th>Status</th>
        <th>Delete Emergency</th>
        <th>Confirm</th>

    </tr>
    </thead>
    <tbody>
    <tr th:each="case : ${cases}">
        <td th:text="${case.patientFullName}"></td>
        <td th:text="${case.patientEmail}"></td>
        <td th:text="${case.patientContactNumber}"></td>
        <td th:text="${case.patientAge}"></td>
        <td th:text="${case.patientGender}"></td>
        <td th:text="${case.patientIssues}"></td>
        <td th:text="${case.status}"></td>
        <td>
            <form th:action="@{'/emergency/emergency-cases/delete/' + ${case.id}}"
                  method="post">
                <button type="submit" class="btn btn-sm">
                    <i class="bi bi-trash"></i>
                </button>
            </form>
        </td>
        <td>
            <form th:action="@{'/emergency/emergency-cases/confirm/' + ${case.id}}"
                  method="post">
                <button type="submit" class="btn btn-sm">
                    <i class="bi bi-check-circle-fill"></i>
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<br></br>
<div class="d-flex flex-wrap justify-content-center gap-3">
    <a th:href="@{/}" class="btn btn-admin btn-portal">
        <i class="bi bi-house"></i> Back to Home
    </a>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
