<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Profile - E-Channeling Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e6f2ff;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .profile-card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #155ab6;
        }
        .error {
            color: #dc3545;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div th:replace="validation-errors :: singleError"></div>
<div th:replace="validation-errors :: errorDisplay"></div>
<div class="profile-card">
    <h2>Patient Profile</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="@{/patients/account/profile/edit}" method="post">
        <input type="hidden" name="email" th:value="${patient.email}">
        <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text"
                   class="form-control"
                   id="fullName"
                   name="fullName"
                   th:value="${patient.fullName}"
                   required
                   minlength="2"
                   maxlength="100">
            <div class="form-text">Full name must be between 2 and 100 characters</div>
        </div>
        <div class="mb-3">
            <label for="contactNumber" class="form-label">Contact Number</label>
            <input type="tel"
                   class="form-control"
                   id="contactNumber"
                   name="contactNumber"
                   th:value="${patient.contactNumber}"
                   pattern="[0-9]{10}"
                   required>
            <div class="form-text">Please enter a 10-digit phone number</div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" th:value="${patient.password}" required>
        </div>
        <button type="submit">Save Changes</button>
    </form>
</div>
</body>
</html>
