<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Portal - E-Channeling Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, rgb(173, 147, 255), rgb(94, 164, 174)); /* purple gradient */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }


        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h2 {
            color: #1a73e8;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        .btn-portal {
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            padding: 12px 25px;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-portal:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-signup {
            background-color: #fbbc05;
            color: #000;
        }

        .btn-signup:hover {
            background-color: #e0a800;
        }

        .btn-login {
            background-color: #1a73e8;
            color: #fff;
        }

        .btn-login:hover {
            background-color: #155ab6;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <h2>Welcome to the Patient Portal</h2>
    <p>Choose how you'd like to proceed:</p>
    <a th:href="@{/patients/register-page}" class="btn btn-signup btn-portal">
        <i class="bi bi-person-plus"></i> Sign Up
    </a>
    <a th:href="@{/patients/login}" class="btn btn-login btn-portal">
        <i class="bi bi-box-arrow-in-right"></i> Login
    </a>
</div>
</body>
</html>
