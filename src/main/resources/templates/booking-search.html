<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Doctors - E-Channeling Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e6f2ff;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .sidebar {
            width: 240px;
            background-color: #1a73e8;
            color: white;
            height: 100vh;
            position: fixed;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            font-size: 22px;
            margin-bottom: 50px;
            text-align: center;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin-bottom: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: 500;
        }

        .sidebar a:hover {
            background-color: #155bb5;
        }

        .main {
            margin-left: 240px;
            flex: 1;
            padding: 40px 50px;
        }

        h1 {
            color: #1a73e8;
            font-size: 36px;
            text-align: center;
            margin-bottom: 50px;
        }

        .search-form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .search-form input, .search-form select {
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 100%;
        }

        .search-btn {
            background-color: #1a73e8;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .search-btn:hover {
            background-color: #155bb5;
        }

        .doctor-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .doctor-info h3 {
            color: #1a73e8;
            margin-bottom: 10px;
        }

        .select-btn {
            background-color: #28a745;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .select-btn:hover {
            opacity: 0.85;
        }

        .back-btn {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            opacity: 0.85;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>Patient Portal</h2>
    <a th:href="@{/patients/dashboard(email=${patient.email})}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a th:href="@{/patients/account/profile(email=${patient.email})}"><i class="bi bi-person"></i> Profile</a>
</div>
<div class="main">
    <h1>Search Doctors</h1>

    <a th:href="@{/patients/dashboard(email=${patient.email})}" class="back-btn">← Back to Dashboard</a>

    <!-- Search Form -->
    <div class="search-form">
        <form th:action="@{/patients/booking/search}" method="get">
            <input type="hidden" name="email" th:value="${patient.email}">

            <div class="row">
                <div class="col-md-6">
                    <label>Specialization:</label>
                    <input type="text" name="specialization" th:value="${specialization}" placeholder="e.g., Cardiology">
                </div>
                <div class="col-md-6">
                    <label>Date:</label>
                    <input type="date" name="date" th:value="${selectedDate}" required>
                </div>
            </div>

            <button type="submit" class="search-btn">Search Doctors</button>
        </form>
    </div>

    <!-- Doctor Results -->
    <div th:if="${doctors}" class="doctors-list">
        <h2>Available Doctors</h2>

        <div th:if="${doctors.isEmpty()}" class="alert alert-info">
            No doctors found matching your criteria. Please try different search parameters.
        </div>

        <div th:each="doctor : ${doctors}" class="doctor-card">
            <div class="row">
                <div class="col-md-8">
                    <div class="doctor-info">
                        <h3 th:text="${doctor.fullName}"></h3>
                        <p><strong>Specialization:</strong> <span th:text="${doctor.specialization}"></span></p>
                        <p><strong>Email:</strong> <span th:text="${doctor.email}"></span></p>
                        <p><strong>Phone:</strong> <span th:text="${doctor.number}"></span></p>
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <form th:action="@{/patients/booking/slots}" method="get">
                        <input type="hidden" name="email" th:value="${patient.email}">
                        <input type="hidden" name="doctorId" th:value="${doctor.id}">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <button type="submit" class="select-btn">View Available Slots</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
