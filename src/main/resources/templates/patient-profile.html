<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile - E-Channeling Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e6f2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .profile-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h2 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #1a73e8;
            border-color: #1a73e8;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #155bb5;
            border-color: #155bb5;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
            width: 100%;
        }
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #c82333;
        }
        .error, .message {
            text-align: center;
            margin-bottom: 15px;
        }
        .error { color: #dc3545; }
        .message { color: #28a745; }
    </style>
</head>
<body>
<div class="profile-container">
    <h2>Profile</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${message}" class="message" th:text="${message}"></div>
    <form th:action="@{/patients/account/profile/edit}" method="post" th:object="${patient}">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required />
        </div>
        <div class="form-group">
            <label for="contactNumber">Contact Number</label>
            <input type="text" class="form-control" id="contactNumber" th:field="*{contactNumber}" required />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" th:field="*{password}" required />
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
    <form th:action="@{/patients/account/delete}" method="post" style="margin-top: 15px;">
        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete your account? This action cannot be undone.');">Delete Account</button>
    </form>
    <p class="text-center mt-3"><a th:href="@{/patients/dashboard}">Back to Dashboard</a></p>
</div>
</body>
</html>
