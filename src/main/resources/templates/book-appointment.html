<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment - E-Channeling Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e6f2ff;
      padding: 40px;
      margin: 0;
    }
    .booking-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      max-width: 700px;
      margin: 0 auto;
    }
    h2 {
      color: #1a73e8;
      text-align: center;
      margin-bottom: 30px;
    }
    .doctor-card {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .doctor-card:hover {
      border-color: #1a73e8;
      background-color: #f8fbff;
    }
    .doctor-card.selected {
      border-color: #1a73e8;
      background-color: #e6f2ff;
    }
    .specialization-badge {
      background-color: #1a73e8;
      color: white;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="booking-card">
  <h2>
    <i class="bi bi-calendar-plus"></i> Book New Appointment
  </h2>

  <form th:action="@{/patients/appointments/book}" method="post" id="appointmentForm">
    <input type="hidden" name="patientEmail" th:value="${email}">
    <input type="hidden" name="doctorId" id="selectedDoctorId" required>

    <!-- Step 1: Select Specialization -->
    <div class="mb-4">
      <label class="form-label fw-bold">Step 1: Choose Specialization</label>
      <select class="form-control" id="specializationSelect" required>
        <option value="">Select a specialization...</option>
        <option th:each="spec : ${specializations}"
                th:value="${spec}"
                th:text="${spec}">
        </option>
      </select>
    </div>

    <!-- Step 2: Select Doctor -->
    <div class="mb-4" id="doctorSelection" style="display: none;">
      <label class="form-label fw-bold">Step 2: Choose Doctor</label>
      <div id="doctorsList">
        <!-- Doctors will be populated here by JavaScript -->
      </div>
    </div>

    <!-- Step 3: Appointment Details -->
    <div class="mb-4" id="appointmentDetails" style="display: none;">
      <label class="form-label fw-bold">Step 3: Appointment Details</label>

      <div class="mb-3">
        <label for="appointmentTime" class="form-label">Date & Time</label>
        <input type="datetime-local" class="form-control" id="appointmentTime" name="appointmentTime" required>
      </div>

      <div class="mb-3">
        <label for="type" class="form-label">Appointment Type</label>
        <select class="form-control" id="type" name="type" required>
          <option value="REGULAR">Regular Consultation</option>
          <option value="EMERGENCY">Emergency</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Selected Doctor</label>
        <div id="selectedDoctorInfo" class="p-3 border rounded bg-light">
          <!-- Selected doctor info will appear here -->
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-check-circle"></i> Confirm Booking
      </button>
    </div>
  </form>
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  // Get doctors data directly from Thymeleaf
  const allDoctors = /*[[${doctors}]]*/ [];

  console.log("All doctors loaded:", allDoctors);
  console.log("Number of doctors:", allDoctors.length);

  function filterDoctors() {
    console.log("filterDoctors function called");
    const specialization = document.getElementById('specializationSelect').value;
    const doctorsList = document.getElementById('doctorsList');
    const doctorSelection = document.getElementById('doctorSelection');

    console.log("Selected specialization:", specialization);

    if (specialization) {
      const filteredDoctors = allDoctors.filter(doctor => {
        if (!doctor || !doctor.specialization) return false;
        return doctor.specialization === specialization;
      });

      console.log("Filtered doctors for", specialization + ":", filteredDoctors);

      if (filteredDoctors.length > 0) {
        doctorsList.innerHTML = '';
        filteredDoctors.forEach(doctor => {
          const doctorCard = document.createElement('div');
          doctorCard.className = 'doctor-card';
          doctorCard.innerHTML = `
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="mb-1">${doctor.fullName}</h6>
                <span class="specialization-badge">${doctor.specialization}</span>
                <small class="d-block text-muted">${doctor.email}</small>
                <small class="text-muted">${doctor.number || 'Contact not available'}</small>
              </div>
              <button type="button" class="btn btn-outline-primary btn-sm"
                      onclick="selectDoctor(${doctor.id}, '${doctor.fullName.replace(/'/g, "\\'")}', '${doctor.specialization.replace(/'/g, "\\'").replace(/&/g, '&amp;')}')">
                Select
              </button>
            </div>
          `;
          doctorsList.appendChild(doctorCard);
        });
        doctorSelection.style.display = 'block';
      } else {
        doctorsList.innerHTML = '<div class="alert alert-warning">No doctors available for this specialization.</div>';
        doctorSelection.style.display = 'block';
      }
    } else {
      doctorSelection.style.display = 'none';
      document.getElementById('appointmentDetails').style.display = 'none';
    }
  }

  function selectDoctor(doctorId, doctorName, specialization) {
    console.log("selectDoctor called with:", doctorId, doctorName);
    document.getElementById('selectedDoctorId').value = doctorId;
    document.getElementById('selectedDoctorInfo').innerHTML = `
      <strong>${doctorName}</strong><br>
      <span class="specialization-badge">${specialization}</span>
    `;
    document.getElementById('appointmentDetails').style.display = 'block';
  }

  // Initialize when page loads
  document.addEventListener('DOMContentLoaded', function() {
    console.log("DOM loaded - initializing");

    // Set up specialization dropdown event
    const specializationSelect = document.getElementById('specializationSelect');
    if (specializationSelect) {
      specializationSelect.addEventListener('change', filterDoctors);
      console.log("Event listener added to specialization dropdown");
    }

    // Set minimum datetime
    const appointmentTime = document.getElementById('appointmentTime');
    if (appointmentTime) {
      appointmentTime.min = new Date().toISOString().slice(0, 16);
    }

    console.log("Initialization complete");
    console.log("Total doctors available:", allDoctors.length);
  });
  /*]]>*/
</script>

</body>
</html>
