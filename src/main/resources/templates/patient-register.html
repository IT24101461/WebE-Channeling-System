<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration - E-Channeling Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to right, rgb(173, 147, 255), rgb(94, 164, 174));
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            width: 400px;
        }

        h2 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #1a73e8;
            color: white;
            width: 100%;
        }

        button:hover {
            background-color: #155bb5;
        }

        .error {
            color: #dc3545;
            margin-top: 5px;
            font-size: 0.9rem;
        }
    </style>
    <script>
        async function checkEmailExists() {
            const emailField = document.getElementById("email");
            const email = emailField.value.trim();
            const message = document.getElementById("emailMessage");

            // Clear message if email is empty
            if (email === "") {
                message.textContent = "";
                emailField.setCustomValidity("");
                return;
            }

            // Check if email format is valid first
            const emailPattern = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
            if (!emailPattern.test(email)) {
                // Don't show any message for invalid format - let HTML5 validation handle it
                message.textContent = "";
                emailField.setCustomValidity("");
                return;
            }

            // Only check database if email format is valid
            const response = await fetch(`/patients/check-email?email=${encodeURIComponent(email)}`);
            const exists = await response.json();

            if (exists) {
                message.textContent = "⚠️ Email already registered. Please use another.";
                message.style.color = "red";
                emailField.setCustomValidity("Email already registered");
            } else {
                // Don't show "available" message - just clear any errors
                message.textContent = "";
                message.style.color = "green";
                emailField.setCustomValidity("");
            }
        }
    </script>

</head>
<body>
<div class="form-container">
    <h2>Patient Registration</h2>

    <form id="registerForm" action="javascript:void(0);">

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
            <label for="contactNumber">Contact Number</label>
            <input type="text" id="contactNumber" name="contactNumber" maxlength="10" placeholder="07xxxxxxxx" required>
            <div id="contactError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   name="email"
                   class="form-control"
                   pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                   title="Enter a valid email address"
                   required
                   oninput="checkEmailExists()">
            <div id="emailMessage" class="error" style="margin-top: 5px;"></div>
        </div>


        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}"
                   title="Minimum 8 characters, at least one letter and one number"
                   required placeholder="Enter password">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm password">
            <div id="passwordError" class="error"></div>
        </div>

        <button type="submit">Register</button>
    </form>
</div>

<script>
    const form = document.getElementById('registerForm');
    const passwordInput = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');

    form.addEventListener('submit', function(e) {
        let valid = true;

        // Clear previous errors
        document.getElementById('passwordError').textContent = '';
        document.getElementById('contactError').textContent = '';
        const emailMessage = document.getElementById('emailMessage');
        emailMessage.textContent = '';

        // Password match
        if (passwordInput.value !== confirmPassword.value) {
            e.preventDefault();
            document.getElementById('passwordError').textContent = "❌ Passwords do not match!";
            confirmPassword.focus();
            valid = false;
        }

        // Password pattern
        const passPattern = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
        if (!passPattern.test(passwordInput.value)) {
            e.preventDefault();
            document.getElementById('passwordError').textContent =
                "❌ Password must be at least 8 characters and contain letters and numbers.";
            valid = false;
        }

        // Contact validation
        const contactVal = document.getElementById('contactNumber').value.trim();
        if (!/^07\d{8}$/.test(contactVal)) {
            e.preventDefault();
            document.getElementById('contactError').textContent =
                "❌ Contact number must be 10 digits starting with '07'.";
            valid = false;
        }

        // Email validation
        const emailVal = document.getElementById('email').value.trim();
        const emailPattern = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
        if (!emailPattern.test(emailVal)) {
            e.preventDefault();
            emailMessage.textContent = "❌ Enter a valid email address.";
            valid = false;
        }

        // ✅ Submit to backend only if all validations passed
        if (valid) {
            form.removeAttribute("action");
            form.setAttribute("action", "/patients/register");
            form.setAttribute("method", "post");
            form.submit();
        }
    });
</script>


</body>
</html>
