<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reschedule Appointment - E-Channeling Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e6f2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .reschedule-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h2 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #1a73e8;
            border-color: #1a73e8;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #155bb5;
            border-color: #155bb5;
        }
        .error {
            color: #dc3545;
            text-align: center;
            margin-bottom: 15px;
        }
        .detail-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .detail-value {
            margin: 0 0 10px;
            padding: 5px;
            background: #f9f9f9;
            border-radius: 4px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const newTimeInput = document.getElementById('newTime');
            const now = new Date();
            // Set minimum date to today, adjusting to local time
            const minDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0).toISOString().slice(0, 16);
            newTimeInput.min = minDate;

            // Prevent submission if date is in the past
            const form = document.querySelector('form');
            form.addEventListener('submit', (event) => {
                const selectedDate = new Date(newTimeInput.value);
                if (selectedDate < now) {
                    event.preventDefault();
                    alert('Please select a future date and time.');
                }
            });
        });
    </script>
</head>
<body>
<div class="reschedule-container">
    <h2>Reschedule Appointment</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="@{'/patients/appointments/reschedule/' + ${appointment.id}}" method="post">
        <div class="form-group">
            <div class="detail-label">Doctor</div>
            <div class="detail-value" th:text="${appointment.doctor.fullName}"></div>
            <div class="detail-label">Current Date & Time</div>
            <div class="detail-value" th:text="${#temporals.format(appointment.appointmentTime, 'yyyy-MM-dd HH:mm')}"></div>
        </div>
        <div class="form-group">
            <label for="newTime">New Date & Time</label>
            <input type="datetime-local" class="form-control" id="newTime" name="newTime" required />
        </div>
        <button type="submit" class="btn btn-primary">Confirm Reschedule</button>
    </form>
    <p class="text-center mt-3"><a th:href="@{/patients/dashboard}">Back to Dashboard</a></p>
</div>
</body>
</html>
