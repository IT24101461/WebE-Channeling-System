<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard - E-Channeling Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Semi-transparent background overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            width: 400px;
            max-width: 90%;
            position: relative;
        }

        .modal-container h2 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 20px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #555;
        }

        .form-group { margin-bottom: 15px; }
        .btn-primary {
            background-color: #1a73e8;
            border-color: #1a73e8;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #155bb5;
            border-color: #155bb5;
        }
        .error { color: #dc3545; text-align: center; margin-bottom: 15px; }
        .detail-label { font-weight: bold; color: #333; margin-bottom: 5px; }
        .detail-value { margin: 0 0 10px; padding: 5px; background: #f9f9f9; border-radius: 4px; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('modalOverlay');
            const closeBtn = document.getElementById('closeModal');
            const newTimeInput = document.getElementById('newTime');
            const now = new Date();

            // Set minimum date to today
            const minDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0)
                .toISOString().slice(0,16);
            newTimeInput.min = minDate;

            closeBtn.addEventListener('click', () => {
                overlay.style.display = 'none';
            });

            // Prevent submission if date is in the past
            const form = document.getElementById('rescheduleForm');
            form.addEventListener('submit', (event) => {
                const selectedDate = new Date(newTimeInput.value);
                if (selectedDate < now) {
                    event.preventDefault();
                    alert('Please select a future date and time.');
                }
            });
        });
    </script>
</head>
<body>
<!-- The modal overlay -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-container">
        <button id="closeModal" class="close-btn">&times;</button>
        <h2>Reschedule Appointment</h2>
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <form id="rescheduleForm" th:action="@{'/patients/appointments/reschedule/' + ${appointment.id}}" method="post">
            <div class="form-group">
                <div class="detail-label">Doctor</div>
                <div class="detail-value" th:text="${appointment.doctor.fullName}"></div>
                <div class="detail-label">Current Date & Time</div>
                <div class="detail-value" th:text="${#temporals.format(appointment.appointmentTime, 'yyyy-MM-dd HH:mm')}"></div>
            </div>
            <div class="form-group">
                <label for="newTime">New Date & Time</label>
                <input type="datetime-local" class="form-control" id="newTime" name="newTime" required />
            </div>
            <button type="submit" class="btn btn-primary">Confirm Reschedule</button>
        </form>
    </div>
</div>
</body>
</html>
