<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Time Slot - E-Channeling Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e6f2ff;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .sidebar {
            width: 240px;
            background-color: #1a73e8;
            color: white;
            height: 100vh;
            position: fixed;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            font-size: 22px;
            margin-bottom: 50px;
            text-align: center;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin-bottom: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: 500;
        }

        .sidebar a:hover {
            background-color: #155bb5;
        }

        .main {
            margin-left: 240px;
            flex: 1;
            padding: 40px 50px;
        }

        h1 {
            color: #1a73e8;
            font-size: 36px;
            text-align: center;
            margin-bottom: 30px;
        }

        .doctor-info {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .doctor-info h3 {
            color: #1a73e8;
            margin-bottom: 15px;
        }

        .slots-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .slot-btn {
            padding: 15px 10px;
            background-color: #e8f4fd;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .slot-btn:hover {
            background-color: #1a73e8;
            color: white;
        }

        .slot-btn.selected {
            background-color: #1a73e8;
            color: white;
        }

        .appointment-form {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .confirm-btn {
            background-color: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 16px;
        }

        .confirm-btn:hover {
            opacity: 0.85;
        }

        .back-btn {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            opacity: 0.85;
            color: white;
            text-decoration: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>Patient Portal</h2>
    <a th:href="@{/patients/dashboard(email=${patient.email})}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a th:href="@{/patients/account/profile(email=${patient.email})}"><i class="bi bi-person"></i> Profile</a>
</div>
<div class="main">
    <h1>Select Time Slot</h1>

    <a th:href="@{/patients/booking/search(email=${patient.email})}" class="back-btn">← Back to Search</a>

    <!-- Doctor Information -->
    <div class="doctor-info">
        <h3 th:text="${doctor.fullName}"></h3>
        <p><strong>Specialization:</strong> <span th:text="${doctor.specialization}"></span></p>
        <p><strong>Email:</strong> <span th:text="${doctor.email}"></span></p>
        <p><strong>Selected Date:</strong> <span th:text="${selectedDate}"></span></p>
    </div>

    <!-- Available Time Slots -->
    <div class="slots-container">
        <h3>Available Time Slots</h3>

        <div th:if="${availableSlots.isEmpty()}" class="alert alert-warning">
            No available slots for the selected date. Please choose a different date.
        </div>

        <form th:if="${not availableSlots.isEmpty()}" th:action="@{/patients/booking/confirm}" method="post">
            <input type="hidden" name="email" th:value="${patient.email}">
            <input type="hidden" name="doctorId" th:value="${doctor.id}">
            <input type="hidden" name="date" th:value="${selectedDate}">

            <div class="slots-grid">
                <div th:each="slot : ${availableSlots}" class="slot-btn" onclick="selectSlot(this, '[[${slot}]]')">
                    <span th:text="${slot}"></span>
                </div>
            </div>

            <div class="appointment-form">
                <div class="form-group">
                    <label for="appointmentType">Appointment Type:</label>
                    <select name="type" id="appointmentType" required>
                        <option value="REGULAR">Regular Appointment</option>
                        <option value="EMERGENCY">Emergency Appointment</option>
                    </select>
                </div>

                <input type="hidden" name="time" id="selectedTime" required>
                <button type="submit" class="confirm-btn" id="confirmBtn" disabled>Confirm Booking</button>
            </div>
        </form>
    </div>
</div>

<script>
    function selectSlot(element, time) {
        // Remove selection from all slots
        document.querySelectorAll('.slot-btn').forEach(btn => {
            btn.classList.remove('selected');
        });

        // Select current slot
        element.classList.add('selected');

        // Set hidden input value
        document.getElementById('selectedTime').value = time;

        // Enable confirm button
        document.getElementById('confirmBtn').disabled = false;
    }
</script>
</body>
</html>
