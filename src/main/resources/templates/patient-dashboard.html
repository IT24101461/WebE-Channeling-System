<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Patient Dashboard - E-Channeling Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e6f2ff;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background-color: #1a73e8;
      color: white;
      height: 100vh;
      position: fixed;
      padding: 20px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
    }

    .sidebar h2 {
      font-size: 22px;
      margin-bottom: 50px;
      text-align: center;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      margin-bottom: 12px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: #155bb5;
    }

    .main {
      margin-left: 240px;
      flex: 1;
      padding: 40px 50px;
    }

    h1 {
      color: #1a73e8;
      font-size: 36px;
      text-align: center;
      margin-bottom: 50px;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>Patient Portal</h2>
  <a th:href="@{/patients/dashboard}" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Log Out</a>
</div>
<div class="main">
  <h1>Welcome to Your Dashboard</h1>
  <p>This is your patient dashboard. You can view appointments, manage your profile, and more!</p>
  <!-- Add more content as needed -->
</div>
</body>
</html>
