<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Patient Dashboard - E-Channeling Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e6f2ff;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background-color: #1a73e8;
      color: white;
      height: 100vh;
      position: fixed;
      padding: 20px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
    }

    .sidebar h2 {
      font-size: 22px;
      margin-bottom: 50px;
      text-align: center;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      margin-bottom: 12px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: #155bb5;
    }

    .main {
      margin-left: 240px;
      flex: 1;
      padding: 40px 50px;
    }

    h1 {
      color: #1a73e8;
      font-size: 36px;
      text-align: center;
      margin-bottom: 50px;
    }

    h2 {
      color: #1a73e8;
      margin-top: 40px;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .table-container {
      margin-bottom: 40px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      border: none;
      text-align: center;
    }

    th {
      background-color: #1a73e8;
      color: white;
      font-size: 16px;
    }

    tr:nth-child(even) {
      background-color: #f2f6ff;
    }

    button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .cancel { background-color: #dc3545; color: white; }
    .cancel:hover { opacity: 0.85; }

    .reschedule { background-color: #007bff; color: white; }
    .reschedule:hover { opacity: 0.85; }

    .book-appointment, .request-emergency {
      background-color: #28a745;
      color: white;
      margin-right: 10px;
    }

    .book-appointment:hover, .request-emergency:hover {
      opacity: 0.85;
    }

    .feedback {
      background-color: #ffc107;
      color: white;
    }

    .feedback:hover {
      opacity: 0.85;
    }

    .error {
      color: #dc3545;
      text-align: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>Patient Portal</h2>
  <a th:href="@{/patients/dashboard}" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a th:href="@{/patients/account/profile}"><i class="bi bi-person"></i> Profile</a>
  <a th:href="@{/patients/logout}" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Log Out</a>
</div>
<div class="main">
  <h1>Welcome to Your Dashboard, <span th:text="${patient.fullName}"></span></h1>
  <div th:if="${param.success}" class="alert alert-success text-center">
    <span th:text="${param.success}"></span>
  </div>
  <div th:if="${error}" class="error" th:text="${error}"></div>

  <!-- New Appointment Buttons -->
  <div style="text-align: center; margin-bottom: 40px;">
    <a th:href="@{/patients/book-appointment}" class="btn book-appointment">
      Book Appointment
    </a>
    <button class="request-emergency">Request Emergency Appointment</button>
  </div>

  <!-- Upcoming Appointments -->
  <h2>Upcoming Appointments</h2>
  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>Doctor</th>
        <th>Date & Time</th>
        <th>Type</th>
        <th>Payment Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="appt : ${upcomingAppointments}">
        <td th:text="${appt.doctor.fullName}"></td>
        <td th:text="${appt.appointmentTime}"></td>
        <td th:text="${appt.type}"></td>
        <td th:text="${appt.paymentStatus} ?: 'N/A'"></td>
        <td>
          <form th:action="@{/patients/appointments/cancel/{id}(id=${appt.id})}" method="post" style="display:inline;">
            <button class="cancel">Cancel</button>
          </form>
          <form th:action="@{/patients/reschedule-appointment/{id}(id=${appt.id})}" method="get" style="display:inline;">
            <button class="reschedule">Reschedule</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Past Appointments -->
  <h2>Past Appointments</h2>
  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>Doctor</th>
        <th>Date & Time</th>
        <th>Type</th>
        <th>Payment Status</th>
        <th>Feedback</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="appt : ${pastAppointments}">
        <td th:text="${appt.doctor.fullName}"></td>
        <td th:text="${appt.appointmentTime}"></td>
        <td th:text="${appt.type}"></td>
        <td th:text="${appt.paymentStatus} ?: 'N/A'"></td>
        <td>
          <button class="feedback">Feedback</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
