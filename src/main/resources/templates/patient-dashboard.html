<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Patient Dashboard - E-Channeling Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e6f2ff;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background-color: #1a73e8;
      color: white;
      height: 100vh;
      position: fixed;
      padding: 20px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
    }

    .sidebar h2 {
      font-size: 22px;
      margin-bottom: 50px;
      text-align: center;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      margin-bottom: 12px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: #155bb5;
    }

    .main {
      margin-left: 240px;
      flex: 1;
      padding: 40px 50px;
    }

    h1 {
      color: #1a73e8;
      font-size: 36px;
      text-align: center;
      margin-bottom: 50px;
    }

    h2 {
      color: #1a73e8;
      margin-top: 40px;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .table-container {
      margin-bottom: 40px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      border: none;
      text-align: center;
    }

    th {
      background-color: #1a73e8;
      color: white;
      font-size: 16px;
    }

    tr:nth-child(even) {
      background-color: #f2f6ff;
    }

    button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .cancel { background-color: #dc3545; color: white; }
    .cancel:hover { opacity: 0.85; }

    .reschedule { background-color: #007bff; color: white; }
    .reschedule:hover { opacity: 0.85; }

    .book-appointment, .request-emergency {
      background-color: #28a745;
      color: white;
      margin-right: 10px;
      padding: 12px 24px;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
      border-radius: 8px;
    }

    .book-appointment:hover, .request-emergency:hover {
      opacity: 0.85;
      color: white;
    }

    .request-emergency {
      background: linear-gradient(135deg, #dc3545, #c82333);
      animation: pulse-emergency 2s infinite;
    }

    @keyframes pulse-emergency {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
    }

    .feedback {
      background-color: #ffc107;
      color: white;
    }

    .feedback:hover {
      opacity: 0.85;
    }

    .error {
      color: #dc3545;
      text-align: center;
      margin-bottom: 15px;
    }

    .emergency-badge {
      background: linear-gradient(135deg, #dc3545, #c82333);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
      animation: pulse-badge 2s infinite;
    }

    @keyframes pulse-badge {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .priority-high {
      color: #dc3545;
      font-weight: 600;
    }

    .priority-medium {
      color: #ffc107;
      font-weight: 600;
    }

    .priority-low {
      color: #28a745;
      font-weight: 600;
    }

    .status-pending {
      background-color: #ffc107;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-confirmed {
      background-color: #28a745;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-completed {
      background-color: #6c757d;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-cancelled {
      background-color: #dc3545;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .section-divider {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 3px solid #e0e0e0;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>Patient Portal</h2>
  <a th:href="@{/patients/dashboard(email=${patient.email})}" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a th:href="@{/patients/account/profile(email=${patient.email})}"><i class="bi bi-person"></i> Profile</a>
</div>
<div class="main">
  <h1>Welcome to Your Dashboard, <span th:text="${patient.fullName}"></span></h1>
  <div th:if="${param.success}" class="alert alert-success text-center">
    <span th:text="${param.success}"></span>
  </div>
  <div th:if="${error}" class="error" th:text="${error}"></div>

  <!-- New Appointment Buttons -->
  <div style="text-align: center; margin-bottom: 40px;">
    <a th:href="@{/patients/book-appointment(email=${patient.email})}" class="book-appointment">
      <i class="bi bi-calendar-plus"></i> Book Appointment
    </a>
    <a th:href="@{/patients/emergency-booking(email=${patient.email})}" class="request-emergency">
      <i class="bi bi-exclamation-triangle-fill"></i> Request Emergency Appointment
    </a>
  </div>

  <!-- Upcoming Appointments -->
  <h2>Upcoming Appointments</h2>
  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>Doctor</th>
        <th>Date & Time</th>
        <th>Type</th>
        <th>Payment Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="appt : ${upcomingAppointments}">
        <td th:text="${appt.doctor.fullName}"></td>
        <td th:text="${appt.appointmentTime}"></td>
        <td th:text="${appt.type}"></td>
        <td th:text="${appt.paymentStatus} ?: 'N/A'"></td>
        <td>
          <form th:action="@{/patients/appointments/cancel/{id}(id=${appt.id},email=${patient.email})}" method="post" style="display:inline;">
            <button class="cancel">Cancel</button>
          </form>
          <form th:action="@{/patients/appointments/reschedule/{id}(id=${appt.id},email=${patient.email})}" method="post" style="display:inline;">
            <input type="datetime-local" name="newTime" required/>
            <button class="reschedule">Reschedule</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Past Appointments -->
  <h2>Past Appointments</h2>
  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>Doctor</th>
        <th>Date & Time</th>
        <th>Type</th>
        <th>Payment Status</th>
        <th>Feedback</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="appt : ${pastAppointments}">
        <td th:text="${appt.doctor.fullName}"></td>
        <td th:text="${appt.appointmentTime}"></td>
        <td th:text="${appt.type}"></td>
        <td th:text="${appt.paymentStatus} ?: 'N/A'"></td>
        <td>
          <button class="feedback">Feedback</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
